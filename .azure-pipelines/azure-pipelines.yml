trigger: { branches: { include: [ main ] } }
pool: { vmImage: 'ubuntu-latest' }
variables: { JDK_VERSION: '17', ACR_NAME: 'youracr', AKS_NAMESPACE: 'bechde-dev' }
stages:
  - stage: Build_Test
    jobs:
      - job: MavenBuild
        steps:
          - task: JavaToolInstaller@0
            inputs: { versionSpec: '$(JDK_VERSION)', jdkArchitectureOption: 'x64' }
          - script: |
              cd services/listings-service
              mvn -B -DskipTests=false clean verify
            displayName: 'Build + Test (Jacoco >=80%)'
