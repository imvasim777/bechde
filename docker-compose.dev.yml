version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: bechde
      POSTGRES_PASSWORD: bechde
      POSTGRES_DB: bechde
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bechde"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
