spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bechde}
    username: ${DB_USER:bechde}
    password: ${DB_PASS:bechde}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: listings
  flyway:
    enabled: true
    create-schemas: true
    schemas: listings
server:
  port: ${PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
