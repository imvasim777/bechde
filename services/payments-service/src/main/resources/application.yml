server:
  port: ${PORT:8084}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bechde}
    username: ${DB_USER:bechde}
    password: ${DB_PASS:bechde}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:payments}
  flyway:
    enabled: true
    create-schemas: true
    schemas: ${DB_SCHEMA:payments}

management:
  endpoints:
    web:
      exposure:
        include: health,info
