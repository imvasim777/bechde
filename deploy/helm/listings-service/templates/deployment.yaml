apiVersion: apps/v1
kind: Deployment
metadata: { name: listings-service }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: listings-service } }
  template:
    metadata: { labels: { app: listings-service } }
    spec:
      containers:
        - name: listings-service
          image: "{{ .Values.image.repository }}:{{ .Values.tag | default .Values.image.tag }}"
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: DB_URL, value: "{{ .Values.env.DB_URL }}" }
            - { name: DB_USER, value: "{{ .Values.env.DB_USER }}" }
            - { name: DB_PASS, value: "{{ .Values.env.DB_PASS }}" }
          resources:
            requests: { cpu: {{ .Values.resources.requests.cpu }}, memory: {{ .Values.resources.requests.memory }} }
            limits: { cpu: {{ .Values.resources.limits.cpu }}, memory: {{ .Values.resources.limits.memory }} }
---
apiVersion: v1
kind: Service
metadata: { name: listings-service }
spec:
  selector: { app: listings-service }
  ports: [ { port: {{ .Values.service.port }}, targetPort: 8080 } ]
