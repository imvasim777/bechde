apiVersion: apps/v1
kind: Deployment
metadata: { name: chat-service }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: chat-service } }
  template:
    metadata: { labels: { app: chat-service } }
    spec:
      containers: [ { name: chat-service, image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}", ports: [ { containerPort: 8080 } ] } ]
---
apiVersion: v1
kind: Service
metadata: { name: chat-service }
spec:
  selector: { app: chat-service }
  ports: [ { port: {{ .Values.service.port }}, targetPort: 8080 } ]
