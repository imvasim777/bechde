openapi: 3.1.0
info:
  title: Bechde Listings API
  version: 0.1.0
paths:
  /listings:
    post:
      operationId: createListing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string, enum: [USD, INR, EUR] }
    ListingCreate:
      type: object
      required: [title, description, price, category, city]
      properties:
        title: { type: string, minLength: 10, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        price: { $ref: '#/components/schemas/Money' }
        category: { type: string, enum: [electronics, furniture, vehicles, other] }
        city: { type: string, minLength: 2, maxLength: 80 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    Listing:
      allOf:
        - $ref: '#/components/schemas/ListingCreate'
        - type: object
          required: [id, status, slug]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, published, unpublished] }
            slug: { type: string }
            publishedAt: { type: string, format: date-time, nullable: true }
