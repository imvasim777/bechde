openapi: 3.1.0
info:
  title: Bechde Auth API
  version: 0.1.0
paths:
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
        '409':
          description: Email exists
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName, city]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, minLength: 2, maxLength: 50 }
        city: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    JwtResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
