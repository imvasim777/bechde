openapi: 3.1.0
info:
  title: Bechde Users API
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /users/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 2, maxLength: 50 }
                city: { type: string }
                phone: { type: string }
      responses:
        '200': { description: Updated }
